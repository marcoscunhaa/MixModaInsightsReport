# Builds MixModaInsights.exe on a GitHub-hosted Windows runner.
#
# - On every push: runs the tests, builds the .exe with build.bat and keeps the file
#   available for download in the Actions tab (Artifacts) for 30 days.
# - On a version tag (e.g. v1.0): also publishes the .exe in a Release.
# - Can also be triggered manually from Actions > Build Windows .exe > Run workflow.
name: Build Windows .exe

on:
  push:
    branches: ["main", "english-version", "feature/**", "fix/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # only needed to publish the Release on tags

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CI: "true"    # build.bat does not pause waiting for a key press
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Tests
        shell: cmd
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests

      # Folder version: opens much faster (does not extract everything on each launch).
      - name: Build folder version (recommended)
        shell: cmd
        run: build.bat folder

      - name: Zip folder version
        shell: pwsh
        run: |
          Compress-Archive -Path dist\MixModaInsights -DestinationPath MixModaInsights-folder.zip
          "{0:N1} MB" -f ((Get-Item MixModaInsights-folder.zip).Length / 1MB)

      # Single-file version: one .exe, but slower to open.
      - name: Build single executable
        shell: cmd
        run: build.bat

      - name: Check the executable
        shell: pwsh
        run: |
          $exe = Get-Item dist\MixModaInsights.exe
          "{0} - {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: MixModaInsights-folder
          path: MixModaInsights-folder.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: MixModaInsights-exe
          path: dist/MixModaInsights.exe
          retention-days: 30

      - name: Publish to Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MixModaInsights.exe
            MixModaInsights-folder.zip
          generate_release_notes: true
